; tomte's canonical scan plus one allowlisted advisory. A separate env name
; rather than an override of [testenv:safety]: tox parses the rendered
; config strictly, so redefining a canonical env raises
; DuplicateSectionError. The ignore is a command-line flag because safety
; 3.7.0's deprecated `check` only accepts integer ids in a policy file and
; rejects the `SFTY-` form the advisory is published under.
;
; SFTY-20260902-58666 (CVE-2026-81726, nltk <=3.10.3): nltk is not a
; dependency of this repo. safety itself requires `nltk>=3.9` with no upper
; bound, so the scan reports a dependency of the scanner rather than
; anything optimus ships. nltk 3.10.3 is the latest release, so there is no
; patched version to move to. Drop this env and go back to `-e safety` in
; the workflow once tomte constrains it upstream:
; https://github.com/valory-xyz/optimus/issues/389
[testenv:safety-with-ignores]
skipsdist = True
skip_install = True
; httpx 0.28 dropped `NetworkError`; safety 3.7.0's event-handler imports it.
deps =
    httpx<0.28
    tomte[safety] @ git+https://github.com/valory-xyz/tomte.git@v0.7.2
commands =
    safety check \
        --policy-file {envsitepackagesdir}/tomte/configs/safety-policy.yml \
        --ignore SFTY-20260902-58666
